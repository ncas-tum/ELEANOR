[tox]
requires = 
    tox>=4.53.1
    tox-uv>=1.35.2
env_list = type, lint, 3.13, 3.12, 3.11

[testenv]
description = Run test under {base_python}
deps =
    pytest>=9.0.3
    pytest-sugar>=1.1.1
commands =
    uv pip install .
    pytest {posargs:tests}

[testenv:lint]
description = Run linters
skip_install = true
deps =
    ruff>=0.15.12
commands =
    ruff check {posargs:eleanor test docs}
    ruff format --check {posargs:eleanor test docs}

[testenv:format]
description = Run code formatting
skip_install = true
deps =
    ruff>=0.15.12
commands =
    ruff check --fix {posargs:eleanor test docs setup.py}
    ruff check --select I --fix {posargs:eleanor test docs setup.py}
    ruff format {posargs:eleanor test docs setup.py}