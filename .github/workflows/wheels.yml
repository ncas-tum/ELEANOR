name: Build wheels

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: Build (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
        cuda:
          - name: cpu
            image: "almalinux:8"
            extra: cpu
            archs: ""
          - name: cu126
            image: "nvidia/cuda:12.6.3-devel-rockylinux8"
            extra: cuda12
            archs: "7.0;7.5;8.0;8.6;8.9;9.0"
          - name: cu130
            image: "nvidia/cuda:13.0.1-devel-rockylinux8"
            extra: cuda13
            archs: "7.5;8.0;8.6;8.9;9.0;10.0;12.0+PTX"

    steps:
      # The CUDA base image is huge; default runners don't have room for it
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + tags, needed by setuptools-scm

      - uses: astral-sh/setup-uv@v6

      - name: Compute version
        id: version
        run: |
          BASE=$(uvx --from setuptools-scm python -m setuptools_scm)
          if [[ "$BASE" == *+* ]]; then
            VERSION="${BASE}.${{ matrix.cuda.name }}"
          else
            VERSION="${BASE}+${{ matrix.cuda.name }}"
          fi
          echo "Building version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build wheel
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: export
          build-args: |
            BASE_IMAGE=${{ matrix.cuda.image }}
            UV_EXTRA=${{ matrix.cuda.extra }}
            TORCH_CUDA_ARCH_LIST=${{ matrix.cuda.archs }}
            PYTHON_VERSION=${{ matrix.python }}
            ELEANOR_VERSION=${{ steps.version.outputs.version }}
            MAX_JOBS=4
          outputs: type=local,dest=dist

      - name: Check wheel contents
        run: |
          ls -lh dist/
          unzip -l dist/*.whl
          if unzip -l dist/*.whl | grep -E 'eleanor\.libs/(libtorch|libc10|libcudart|libcuda|libgomp)'; then
            echo "ERROR: torch/CUDA libraries were bundled into the wheel"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.cuda.name }}-py${{ matrix.python }}
          path: dist/*.whl
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl