name: Build wheels

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# One cp311-abi3 wheel per hardware variant (0.1.0+cpu, 0.1.0+cu126,
# 0.1.0+cu130), each pinning the torch build it was compiled against. Users
# install from the per-variant index on GitHub Pages:
#
#   pip install eleanor-ncas --extra-index-url https://ncas-tum.github.io/ELEANOR/whl/cu126
#
#   build   -> variant wheel (Docker) with torch/torchvision/jax pinned
#   smoke   -> serve the index locally, install from it with pip and uv, import
#   release -> attach the wheels to the GitHub release (tags only)
#   pages   -> rebuild docs + index from all releases (tags only)

jobs:
  build:
    name: Build (${{ matrix.variant.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant:
          - name: cpu
            image: "almalinux:8"
            extra: cpu
            archs: ""
          - name: cu126
            image: "nvidia/cuda:12.6.3-devel-rockylinux8"
            extra: cuda12
            archs: "7.0;7.5;8.0;8.6;8.9;9.0"
          - name: cu130
            image: "nvidia/cuda:13.0.1-devel-rockylinux8"
            extra: cuda13
            archs: "7.5;8.0;8.6;8.9;9.0;10.0;12.0+PTX"

    steps:
      # The CUDA base image is huge; default runners don't have room for it
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + tags, needed by setuptools-scm

      - uses: astral-sh/setup-uv@v6

      # 0.1.0 -> 0.1.0+cu126; untagged 0.1.1.dev3+g1234abc -> 0.1.1.dev3+cu126
      - name: Compute version
        id: version
        run: |
          BASE=$(uvx --from setuptools-scm python -m setuptools_scm)
          VERSION="${BASE%%+*}+${{ matrix.variant.name }}"
          echo "Building version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build wheel
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: export
          # The wheel is abi3 (Python 3.11+), so one Python version is enough
          build-args: |
            BASE_IMAGE=${{ matrix.variant.image }}
            UV_EXTRA=${{ matrix.variant.extra }}
            TORCH_CUDA_ARCH_LIST=${{ matrix.variant.archs }}
            PYTHON_VERSION=3.11
            ELEANOR_VERSION=${{ steps.version.outputs.version }}
            MAX_JOBS=4
          outputs: type=local,dest=raw

      - name: Pin torch, torchvision and jax for this variant
        run: |
          PINS=$(uv export --frozen --extra ${{ matrix.variant.extra }} \
                   --no-hashes --no-emit-project \
                 | grep -E "^(torch|torchvision)==[^ ]*\+${{ matrix.variant.name }}( |$)" \
                 | cut -d' ' -f1 | sed 's/^/--pin /')
          python3 scripts/make_variant_wheel.py raw/*.whl \
            --variant ${{ matrix.variant.name }} --extra ${{ matrix.variant.extra }} $PINS -o dist

      - name: Check wheel
        run: |
          ls -lh dist/
          unzip -l dist/*.whl
          unzip -p dist/*.whl '*.dist-info/METADATA' | grep -E '^(Version|Requires-Dist):'
          if unzip -l dist/*.whl | grep -E 'eleanor(_ncas)?\.libs/(libtorch|libc10|libcudart|libcuda|libgomp|libnvrtc)'; then
            echo "ERROR: torch/CUDA libraries were bundled into the wheel"
            exit 1
          fi
          uvx abi3audit --strict --verbose dist/*.whl

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.variant.name }}
          path: dist/*.whl
          if-no-files-found: error

  # No GPU on the runners: this checks that each variant installs the right
  # torch/jax builds and that its extension loads, not that the kernels run.
  smoke:
    name: Smoke (py${{ matrix.python }}, ${{ matrix.variant }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
        variant: [cpu, cu126, cu130]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - uses: actions/download-artifact@v4
        with:
          name: wheel-${{ matrix.variant }}
          path: wheels

      - name: Serve the index locally
        run: |
          python3 scripts/build_index.py -o index wheels/*.whl
          python3 -m http.server 8000 --directory index > /dev/null 2>&1 &
          sleep 2
          curl -sf http://localhost:8000/${{ matrix.variant }}/eleanor-ncas/ > /dev/null

      - name: pip install eleanor-ncas --extra-index-url ...
        run: |
          uv venv --seed --python ${{ matrix.python }} pip-env
          pip-env/bin/python -m pip install --disable-pip-version-check -q eleanor-ncas \
            --extra-index-url http://localhost:8000/${{ matrix.variant }}
          pip-env/bin/python scripts/check_install.py ${{ matrix.variant }}

      - name: uv add eleanor-ncas --index ...
        env:
          UV_HTTP_TIMEOUT: "300"   # pypi.nvidia.com can be slow
        run: |
          uv init -q --bare --python ${{ matrix.python }} uv-project
          cd uv-project
          uv add -q eleanor-ncas --index http://localhost:8000/${{ matrix.variant }}
          uv run python ../scripts/check_install.py ${{ matrix.variant }}

  release:
    name: Publish GitHub release
    needs: smoke
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'a') || contains(github.ref_name, 'b') }}

  # Rebuild docs + package index so the new release is installable
  pages:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read   # gh release download
      pages: write
      id-token: write
