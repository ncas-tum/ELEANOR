name: Deploy documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # Called by wheels.yml after a release, so the package index includes it
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: "Set up Python"
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b

      - name: Install the project
        run: uv sync --extra cpu

      - name: Sphinx build
        run: uv run --extra cpu sphinx-build -b html docs/source docs/_build

      - name: Package index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p wheels
          for tag in $(gh release list --limit 1000 --json tagName --jq '.[].tagName'); do
            gh release download "$tag" --pattern 'eleanor_ncas-*+*.whl' --dir wheels || true
          done
          if ls wheels/*.whl > /dev/null 2>&1; then
            python3 scripts/build_index.py -o docs/_build/whl wheels/*.whl
          else
            echo "No released wheels yet: skipping the package index"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
