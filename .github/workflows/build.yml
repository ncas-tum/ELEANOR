name: Build Wheels
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-cuda:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12"]
        include:
        - cuda: "126"
          cuda_image: "12.6.0"
        - cuda: "130"
          cuda_image: "13.0.0"
    runs-on: ubuntu-latest
    container: nvidia/cuda:${{ matrix.cuda_image }}-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt update && apt install -y software-properties-common
          add-apt-repository -y ppa:deadsnakes/ppa
          apt update && apt install -y python${{ matrix.python }} python${{ matrix.python }}-venv python${{ matrix.python }}-dev patchelf git
          python${{ matrix.python }} -m ensurepip --upgrade
      - name: Install deps
        run: |
          python${{ matrix.python }} -m pip install --upgrade pip
          python${{ matrix.python }} -m pip install torch --extra-index-url https://download.pytorch.org/whl/cu${{ matrix.cuda }}
          python${{ matrix.python }} -m pip install build auditwheel
      - name: Build wheel
        env:
          CUDA_VERSION: ${{ matrix.cuda }}
        run: python${{ matrix.python }} -m build --wheel
      - name: Repair wheel
        run: |
          python${{ matrix.python }} -m auditwheel repair dist/*.whl -w dist_repaired/ \
            --exclude libtorch.so \
            --exclude libtorch_cuda.so \
            --exclude libtorch_cpu.so \
            --exclude libc10.so \
            --exclude libc10_cuda.so
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-cu${{ matrix.cuda }}-py${{ matrix.python }}
          path: dist_repaired/*.whl
  build-cpu:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
 
      - name: Install deps
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt update && apt install -y patchelf git
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install build auditwheel
 
      - name: Build wheel
        env:
          CUDA_VERSION: "cpu"
        run: python -m build --wheel
 
      - name: Repair wheel
        run: |
          python -m auditwheel repair dist/*.whl -w dist_repaired/ \
            --exclude libtorch.so \
            --exclude libtorch_cpu.so \
            --exclude libc10.so
 
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-cpu-py${{ matrix.python }}
          path: dist_repaired/*.whl