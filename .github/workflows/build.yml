  build-cpu:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Install system tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt update
          sudo apt install -y git patchelf

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build wheel
        env:
          CUDA_VERSION: "cpu"
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
        run: uv build --wheel --python ${{ matrix.python }}
 
      - name: Repair wheel
        run: |
          uv run --no-project --python "${{ matrix.python }}" --with auditwheel \
            python -m auditwheel repair dist/*.whl -w dist_repaired/ \
              --exclude libtorch.so \
              --exclude libtorch_cpu.so \
              --exclude libc10.so
 
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-cpu-py${{ matrix.python }}
          path: dist_repaired/*.whl


