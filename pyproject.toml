[project]
name = "eleanor"
dynamic = ["version"]
description = "Python package to simulate FeLIF neurons"
readme = {file = "README.md", content-type = "text/markdown"}
license = {file = "LICENSE.txt"}
requires-python = ">=3.11,<3.15"
authors = [
  { name = "Fernando M. Quintana Velázquez", email = "fernando.quintana@tum.de" },
  { name = "Luca Fehlings", email = "luca.fehlings@tum.de" },
  { name = "Martin A. Nicholson", email = "m.a.nicholson@student.rug.nl" },
  { name = "Pedro F. Ortiz Costa", email = "p.f.ortiz.costa@student.rug.nl" },
]
maintainers = [
  { name = "Fernando M. Quintana Velázquez", email = "fernando.quintana@tum.de" },
]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
]

dependencies = [
  "snntorch>=1.0.0",
  "tonic>=1.7.0",
  "equinox>=0.13.8",
]

[project.urls]
Documentation = "https://ncas-tum.github.io/ELEANOR/"
Repository = "https://github.com/ncas-tum/ELEANOR"
Issues = "https://github.com/ncas-tum/ELEANOR/issues"

[project.optional-dependencies]
cpu = [
  "torch>=2.12.0",
  "torchvision>=0.27.0",
  "jax>=0.10.0",
]
cuda12 = [
  "torch>=2.12.0",
  "torchvision>=0.27.0",
  "jax[cuda12]>=0.10.0",
]
cuda13 = [
  "torch>=2.12.0",
  "torchvision>=0.27.0",
  "jax[cuda13]>=0.10.0",
]
mps = [
  "torch>=2.12.0",
  "torchvision>=0.27.0",
  "jax>=0.10.0",
  "jax-mps>=0.10.0",
]
notebook = ["ipykernel>=7.4.0", "ipywidgets>=8.1.9", "boilerplot@git+https://github.com/fehlings/boilerplot.git"]

[dependency-groups]
dev = [
    "expecttest>=0.3.0",
    "hypothesis>=6.170.0",
    "jupyter-sphinx>=0.5.3",
    "myst-nb>=1.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "sphinx>=7.3.7",
    "sphinx-book-theme>=1.3.0",
    "sphinx-copybutton>=0.5.2",
    "sphinx-thebe>=0.3.1",
    "sphinxcontrib-bibtex>=2.6.5",
]

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cuda12" },
    { extra = "cuda13" },
    { extra = "mps" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu",   extra = "cpu", marker = "sys_platform != 'darwin'" },
  { index = "pytorch-cu126", extra = "cuda12" },
  { index = "pytorch-cu130", extra = "cuda13" },
]
torchvision = [
  { index = "pytorch-cpu",   extra = "cpu", marker = "sys_platform != 'darwin'" },
  { index = "pytorch-cu126", extra = "cuda12" },
  { index = "pytorch-cu130", extra = "cuda13" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.scikit-build]
# This ensures the compiled .so file is placed in the correct package folder
wheel.expand-macos-universal-tags = true
cmake.version = "CMakeLists.txt"
build-dir = "build/{wheel_tag}"

[build-system]
requires = ["scikit-build-core", "setuptools-scm", "torch"]
build-backend = "scikit_build_core.build"

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.setuptools_scm"

[tool.setuptools_scm]
version_file = "eleanor/_version.py"