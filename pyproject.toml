[project]
name = "eleanor"
dynamic = ["version", "dependencies"]
description = "Python package to simulate FeLIF neurons"
readme = {file = "README.md", content-type = "text/markdown"}
license = {file = "LICENSE.txt"}
requires-python = ">=3.11"
authors = [
  { name = "Fernando M. Quintana Velázquez", email = "fernando.quintana@tum.de" },
  { name = "Luca Fehlings", email = "luca.fehlings@tum.de" },
  { name = "Martin A. Nicholson", email = "m.a.nicholson@student.rug.nl" },
  { name = "Pedro F. Ortiz Costa", email = "p.f.ortiz.costa@student.rug.nl" },
]
maintainers = [
  { name = "Fernando M. Quintana Velázquez", email = "fernando.quintana@tum.de" },
]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Programming Language :: Python :: 3.11",
  "Operating System :: OS Independent",
]

[project.urls]
Documentation = "https://ncas-tum.github.io/ELEANOR/"
Repository = "https://github.com/ncas-tum/ELEANOR"
Issues = "https://github.com/ncas-tum/ELEANOR/issues"

[project.optional-dependencies]
mps = ["jax-mps>=0.10.0"]
cuda12 = ["jax[cuda12]"]
cuda13 = ["jax[cuda13]"]

[tool.setuptools]
# ext_modules + cmdclass stay in setup.py because BuildExtension is code-only
packages = { find = {} }

[tool.setuptools_scm]
version_file = "eleanor/_version.py"

[build-system]
requires = [
    "setuptools",
    "wheel",
    "torch",
    "setuptools_scm"
]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "expecttest>=0.3.0",
    "hypothesis>=6.153.0",
    "jupyter-sphinx>=0.5.3",
    "myst-nb>=1.4.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "sphinx>=9.0.4",
    "sphinx-book-theme>=1.2.0",
    "sphinx-copybutton>=0.5.2",
    "sphinx-thebe>=0.3.1",
    "sphinxcontrib-bibtex>=2.7.0",
]
